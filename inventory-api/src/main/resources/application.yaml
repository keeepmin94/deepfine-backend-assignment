spring:
    application:
        name: deepfine-inventory
    datasource:
        url: ${DB_URL:jdbc:postgresql://localhost:5432/inventory}
        username: ${POSTGRES_USER:inventory}
        password: ${POSTGRES_PASSWORD}
        hikari:
            transaction-isolation: TRANSACTION_READ_COMMITTED
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                jdbc:
                    time_zone: UTC
    flyway:
        enabled: true

server:
    port: ${SERVER_PORT:8080}

inventory:
    lock-timeout-ms: ${STOCK_LOCK_TIMEOUT_MS:3000}

logging:
    pattern:
        level: "%5p [requestId=%X{requestId:-}]"

name: Inventory verification

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - name: Checkout (v6)
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  persist-credentials: false
            - name: Set up Java (v5)
              uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
              with:
                  distribution: temurin
                  java-version: '21.0.13+9'
            - name: Report environment
              run: |
                  java -version
                  docker version
                  docker compose version
            - name: Run unit, PostgreSQL and HTTP tests
              run: ./gradlew --no-daemon clean check
            - name: Build and verify Compose including persistence
              run: ./scripts/verify-compose.sh
